# /usr/local/share/dwm-config/xdg/gtk-3.0/settings.ini - apps GTK3 no tema escuro
# O .xinitrc poe esta pasta no XDG_CONFIG_DIRS; um ~/.config/gtk-3.0/settings.ini seu vence.
# Pacotes: o Adwaita vem no proprio GTK3; os icones vem do papirus-icon-theme
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
